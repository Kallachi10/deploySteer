services:
  postgres:
    image: postgres:14-alpine
    container_name: steermate_db
    environment:
      POSTGRES_USER: steermate
      POSTGRES_PASSWORD: steermate_pass
      POSTGRES_DB: steermate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steermate -d steermate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steermate_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://steermate:steermate_pass@postgres:5432/steermate_db
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
