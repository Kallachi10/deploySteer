name: steermate
description: Advanced Driver Assistance System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0
  
  # Sensors & Location
  geolocator: ^10.1.0
  sensors_plus: ^4.0.2
  permission_handler: ^11.0.1
  
  # Camera & ML
  camera: ^0.10.5+5
  tflite_flutter: ^0.12.1
  
  # Audio & Haptics
  just_audio: ^0.9.36
  vibration: ^3.1.5
  
  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Utils
  intl: ^0.18.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/sounds/
