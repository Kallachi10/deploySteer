# Local "production-like" override for end-to-end testing.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.local-prod.yml up -d --build
#
# This keeps everything private (runs on your machine) while behaving closer to prod:
# - no source bind-mount
# - no --reload
# - multiple worker processes
#
services:
  # Separate service so we don't inherit the dev bind-mount from docker-compose.yml
  backend_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steermate_backend_prod
    environment:
      DATABASE_URL: postgresql+asyncpg://steermate:steermate_pass@postgres:5432/steermate_db
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  postgres:
    restart: unless-stopped
